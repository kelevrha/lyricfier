<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sube tu foto y compártela</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app {
      width: min(920px, 100%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,.35);
    }
    h1 { margin-top: 0; }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
    }
    label { display:block; margin-bottom: 8px; font-weight:600; }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px 12px;
      background: #020617;
      color: #e2e8f0;
    }
    button {
      border: 0;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    canvas {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #020617;
      margin-top: 12px;
    }
    .share {
      margin-top: 12px;
      font-size: .95rem;
      word-break: break-all;
      color: #86efac;
    }
    .hint { color: #94a3b8; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Foto + frase para compartir</h1>
    <div class="grid">
      <section>
        <label for="name">Tu nombre</label>
        <input id="name" type="text" placeholder="Ej: Carlos" />

        <label for="photo" style="margin-top:12px;">Sube una foto</label>
        <input id="photo" type="file" accept="image/*" />

        <div class="actions">
          <button id="generate">Generar imagen</button>
          <button id="download" type="button">Descargar</button>
        </div>

        <p class="share" id="share"></p>
        <p class="hint">La URL compartida conserva el nombre para regenerar el texto fácilmente.</p>
      </section>
      <section>
        <canvas id="canvas" width="900" height="900"></canvas>
      </section>
    </div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
